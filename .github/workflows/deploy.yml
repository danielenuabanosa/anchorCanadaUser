name: Deploy User Portal

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: user-portal-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env file
        run: echo "${{ secrets.PROVIDER_APP_SECRET }}" > .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy standalone build
        run: |
          rm -rf /var/www/user-portal/*
          cp -r .next/standalone/. /var/www/user-portal/
          cp -r public /var/www/user-portal/public
          mkdir -p /var/www/user-portal/.next
          cp -r .next/static /var/www/user-portal/.next/static
          cp .env.production /var/www/user-portal/.env.production

      - name: Reload PM2
        run: |
          pm2 reload /var/www/ecosystem/user-portal.config.js \
            --env production 2>/dev/null || \
          pm2 start /var/www/ecosystem/user-portal.config.js \
            --env production
          pm2 save

      - name: Health check
        run: |
          sleep 3
          pm2 status user-portal
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost:3001